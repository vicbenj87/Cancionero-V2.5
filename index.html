<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cancionero · IBM El Vivero</title>
<meta name="description" content="Cancionero digital con vista de diapositivas para proyectar en el culto.">
<meta name="theme-color" content="#0b1020">

<link rel="stylesheet" href="css/backgrounds.css">
<link rel="stylesheet" href="css/app.css">

<!-- Icono de la pestaña: el mismo SVG del logotipo, incrustado como data URI.
     Va aquí y no como archivo suelto para que la página siga siendo autónoma
     y funcione con doble clic. El marco original mide medio punto porcentual
     del lienzo; a 16 px se evaporaría, así que aquí va engrosado. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2321A8E0'/%3E%3Crect x='14.3' y='25.5' width='72.2' height='48.4' fill='none' stroke='%23333E50' stroke-width='2'/%3E%3Ctext x='17.9' y='61.5' font-family='Arial Black, Arial, Helvetica, sans-serif' font-weight='900' font-size='37' textLength='64.3' lengthAdjust='spacingAndGlyphs' fill='%23333E50'%3EIBM%3C/text%3E%3C/svg%3E">

<style>
  /* Portada: el sello a la izquierda del nombre y del título.
     Estas tres reglas viven aquí para que el logotipo viaje dentro de esta
     misma página; si prefieres el CSS todo junto, se pueden mover tal cual
     a css/app.css sin tocar nada más. */
  .portada__lockup { display: flex; align-items: center; gap: calc(var(--u) * 2); }
  .portada__sello  { flex: 0 0 auto; display: block; width: 62px; height: 62px; }

  @media (max-width: 640px) {
    .portada__sello { width: 46px; height: 46px; }
  }
</style>
</head>
<body>

<!-- ==========================================================================
     1 · ÍNDICE  (ordenado por título, agrupado por letra)
     ========================================================================== -->
<main class="indice">

  <header class="portada">
    <div class="portada__lockup">

      <!-- Sello IBM El Vivero, dibujado a partir de las medidas del original.
           En la web se usa solo el disco, sin el recuadro celeste de fondo:
           sobre el azul noche de la página, un bloque de color sólido sería
           un parche, mientras que el círculo se lee como una insignia.

           textLength + lengthAdjust fuerzan el ancho exacto de cada línea, así
           que las proporciones del logotipo se mantienen aunque el equipo no
           tenga la tipografía original y sustituya por otra. -->
      <svg class="portada__sello" viewBox="0 0 100 100" role="img" aria-label="IBM El Vivero">
        <circle cx="50.2" cy="49.6" r="30.8" fill="#fff"/>
        <g fill="#05ACF2" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900">
          <text x="29.1" y="36.4" font-size="15.1" textLength="25.9" lengthAdjust="spacingAndGlyphs">IBM</text>
          <text x="29.1" y="54.7" font-size="14.7" textLength="18.3" lengthAdjust="spacingAndGlyphs">EL</text>
          <text x="27.9" y="69.0" font-size="11.9" textLength="48.1" lengthAdjust="spacingAndGlyphs">VIVERO</text>
        </g>
        <rect x="32.5" y="72.7" width="36.3" height="2.1" fill="#05ACF2"/>
      </svg>

      <div>
        <p class="portada__marca">IBM El Vivero</p>
        <h1 class="portada__titulo">Cancionero</h1>
      </div>
    </div>
    <p class="portada__cifra">
      <strong id="cifra-total">0</strong> canciones<br>
      <span id="cifra-fondos">35</span> fondos animados
    </p>
  </header>

  <div class="controles-indice">
    <div class="buscador">
      <svg class="buscador__icono" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
      <label class="sr-solo" for="busqueda">Buscar en títulos y letras</label>
      <input class="buscador__campo" id="busqueda" type="search"
             placeholder="Buscar en títulos y letras…" autocomplete="off" spellcheck="false">
    </div>

    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por culto">
      <button class="filtro" type="button" data-filtro="0" aria-pressed="true">Todas</button>
      <button class="filtro" type="button" data-filtro="1" aria-pressed="false">Dominical</button>
      <button class="filtro" type="button" data-filtro="2" aria-pressed="false">Santa Cena</button>
    </div>
  </div>

  <ul class="lista" id="lista"></ul>

  <div class="vacio" id="vacio" hidden>
    <p class="vacio__titulo" id="vacio-titulo">Todavía no hay canciones</p>
    <p id="vacio-texto"></p>
  </div>

  <footer class="pie">
    <span>Flechas o barra espaciadora para pasar · L para la letra completa · B para pantalla en negro</span>
    <a href="editor.html">Editar el repertorio</a>
  </footer>
</main>

<!-- ==========================================================================
     2 · VISOR DE DIAPOSITIVAS
     Una sola diapositiva en el DOM; el texto se reemplaza al navegar.
     ========================================================================== -->
<section class="visor" id="visor" data-abierto="false" aria-hidden="true" aria-label="Proyección">

  <!-- Capa 1: fondo animado en CSS (siempre presente). -->
  <div class="capa-fondo" id="capa-fondo"></div>

  <!-- Capa 2: imagen o vídeo, solo si carga a tiempo. -->
  <img  class="medio-fondo" id="fondo-imagen" alt="" aria-hidden="true">
  <video class="medio-fondo" id="fondo-video" muted loop playsinline preload="none" aria-hidden="true"></video>

  <!-- Capa 3: velo que asegura el contraste del texto. -->
  <div class="velo"></div>

  <!-- Capa 4: la letra. -->
  <div class="escena" id="escena">
    <div class="diapositiva" id="diapositiva" aria-live="polite"></div>
  </div>

  <!-- Barra superior -->
  <header class="barra" id="barra">
    <span class="barra__titulo" id="visor-titulo"></span>
    <span class="contador" id="contador" aria-label="Diapositiva actual"></span>

    <button class="control boton-barra" id="btn-letra" type="button" title="Letra completa (L)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="4" y1="7" x2="20" y2="7"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="17" x2="14" y2="17"></line>
      </svg>
      Letra completa
    </button>

    <button class="control boton-barra" id="btn-pantalla" type="button" title="Pantalla completa (F)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="4 9 4 4 9 4"></polyline>
        <polyline points="15 4 20 4 20 9"></polyline>
        <polyline points="20 15 20 20 15 20"></polyline>
        <polyline points="9 20 4 20 4 15"></polyline>
      </svg>
      Pantalla
    </button>
  </header>

  <!-- Flechas blancas semitransparentes, abajo en cada lateral.
       Al abrir la canción parpadean unos segundos y luego se ocultan. -->
  <button class="control flecha flecha--anterior" id="btn-anterior" type="button" aria-label="Diapositiva anterior">
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 4 7 12 15 20"></polyline></svg>
  </button>

  <button class="control flecha flecha--siguiente" id="btn-siguiente" type="button" aria-label="Diapositiva siguiente">
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 4 17 12 9 20"></polyline></svg>
  </button>


  <!-- Salir: suelto en el visor y no dentro de la barra, para que siga
       alcanzable cuando todo lo demás se oculta. -->
  <button class="control salir-visor" id="btn-salir-visor" type="button" title="Volver al índice (Esc)">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <line x1="6" y1="6" x2="18" y2="18"></line>
      <line x1="18" y1="6" x2="6" y2="18"></line>
    </svg>
    Salir
  </button>
  <div class="aviso-giro">
    <p>Gira el dispositivo para proyectar en horizontal.</p>
  </div>
</section>

<!-- ==========================================================================
     3 · PANTALLA DE LETRA COMPLETA
     Pantalla propia, vertical y con scroll. No es una diapositiva: al abrirla
     se sale de pantalla completa y no hay flechas de navegación.
     ========================================================================== -->
<section class="pantalla-letra" id="pantalla-letra" data-abierto="false"
         aria-hidden="true" aria-label="Letra completa" tabindex="-1">

  <header class="letra-barra">
    <button class="boton-volver" id="volver-letra" type="button">← Volver</button>
    <span class="letra-ficha" id="letra-ficha"></span>
    <button class="boton-volver boton-proyectar" id="proyectar-letra" type="button"
            title="Abrir esta canción en diapositivas">Proyectar</button>
    <button class="boton-volver" id="btn-salir" type="button"
            title="Volver al índice">Salir</button>
  </header>

  <div class="letra-interior">
    <h2 class="letra-titulo" id="letra-titulo"></h2>
    <div id="letra-cuerpo"></div>
  </div>
</section>

<!-- Orden obligatorio: configuración → datos → aplicación.
     Si prefieres publicar solo js/data/canciones.json, borra la línea de los
     datos: la app lo detecta y lo lee por su cuenta (ver datos.origen). -->
<script src="js/config.js"></script>
<script src="js/data/canciones.js"></script>
<script src="js/app.js"></script>
</body>
</html>
